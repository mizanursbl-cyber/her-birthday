<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>HBD Sumaiya</title>

<link rel="stylesheet" href="file/default.css">

<script src="file/jquery.min.js"></script>
<script src="file/jscex.min.js"></script>
<script src="file/jscex-parser.js"></script>
<script src="file/jscex-jit.js"></script>
<script src="file/jscex-builderbase.min.js"></script>

<style>
/* ✅ text one line + auto resize */
.say {
    white-space: nowrap;
    display: inline-block;
    font-size: clamp(16px, 4vw, 26px);
}

/* ✅ text bampase faka jaygay */
#text {
    position: relative;
    left: -120px;        /* 👈 main fix */
    z-index: 10;
}

/* canvas stays behind */
#canvas {
    position: relative;
    z-index: 1;
}

/* mobile safe */
@media (max-width: 768px) {
    #text {
        left: 0;
        text-align: center;
    }
}
</style>

<script>
function playAudio() {
    document.getElementById("myAudio").play();
}
</script>
</head>

<body>
<div id="main">

<audio autoplay id="myAudio">
    <source src="aud.mp3" type="audio/mp3">
</audio>

<div id="wrap">

<div id="text">
<div id="code">
<span class="say">Hey Sumaiya 💞</span><br>
<span class="say">Happy Birthday 🎈</span><br>
<span class="say">May God bless you 🍀</span><br>
<span class="say">And give u many happiness 💕</span><br>
<span class="say">Just saying... you're pretty awesome ❤️</span><br>
<span class="say">Sending good vibes and maybe a wink 😏</span><br>
<span class="say">Hope u have a great day today ❤️😘</span><br>
<span class="say">And just want to say.... Someone loves you from afar ❤️😘</span><br>
</div>
</div>

<div id="clock-box">
<span id="clock">577 days 0 hours 0 minutes 0 seconds</span>
</div>

<canvas id="canvas" width="1100" height="680"></canvas>

</div>
</div>

<script>
/* 💞 draw name inside heart */
function drawName(canvas) {
    var ctx = canvas.getContext("2d");
    ctx.save();
    ctx.font = "bold 52px cursive";
    ctx.fillStyle = "rgba(255, 60, 120, 0.9)";
    ctx.textAlign = "center";
    ctx.shadowColor = "rgba(255, 100, 160, 0.9)";
    ctx.shadowBlur = 18;

    ctx.fillText(
        "Sumaiya",
        canvas.width / 2 - 60,   // 👈 adjusted to center of heart
        canvas.height / 2 + 40
    );
    ctx.restore();
}

(function() {
    var canvas = $('#canvas');
    if (!canvas[0].getContext) return;

    var width = canvas.width();
    var height = canvas.height();

    var opts = {
        seed: { x: width / 2 - 20, color: "rgb(190,26,37)", scale: 2 },
        branch: [
            [535,680,570,250,500,200,30,100,[
                [540,500,455,417,340,400,13,100,[
                    [450,435,434,430,394,395,2,40]
                ]],
                [550,445,600,356,680,345,12,100,[
                    [578,400,648,409,661,426,3,80]
                ]],
                [539,281,537,248,534,217,3,40],
                [546,397,413,247,328,244,9,80,[
                    [427,286,383,253,371,205,2,40],
                    [498,345,435,315,395,330,4,60]
                ]],
                [546,357,608,252,678,221,6,100,[
                    [590,293,646,277,648,271,2,80]
                ]]
            ]]
        ],
        bloom: { num: 1200, width: 1080, height: 650 },
        footer: { width: 1200, height: 5, speed: 10 }
    };

    var tree = new Tree(canvas[0], width, height, opts);
    var seed = tree.seed;
    var foot = tree.footer;
    var hold = 1;

    canvas.click(function(e) {
        playAudio();
        var offset = canvas.offset();
        if (seed.hover(e.pageX - offset.left, e.pageY - offset.top)) {
            hold = 0;
            canvas.unbind();
        }
    });

    var seedAnimate = eval(Jscex.compile("async", function () {
        seed.draw();
        while (hold) $await(Jscex.Async.sleep(10));
        while (seed.canScale()) {
            seed.scale(0.95);
            $await(Jscex.Async.sleep(10));
        }
        while (seed.canMove()) {
            seed.move(0, 2);
            foot.draw();
            $await(Jscex.Async.sleep(10));
        }
    }));

    var growAnimate = eval(Jscex.compile("async", function () {
        while (tree.canGrow()) {
            tree.grow();
            $await(Jscex.Async.sleep(10));
        }
    }));

    var flowAnimate = eval(Jscex.compile("async", function () {
        while (tree.canFlower()) {
            tree.flower(6);
            drawName(canvas[0]);
            $await(Jscex.Async.sleep(30));
        }
    }));

    var moveAnimate = eval(Jscex.compile("async", function () {
        $await(Jscex.Async.sleep(1600));
        tree.snapshot("p1", 240, 0, 610, 680);
        while (tree.move("p1", 500, 0)) {
            foot.draw();
            $await(Jscex.Async.sleep(10));
        }
    }));

    var textAnimate = eval(Jscex.compile("async", function () {
        $("#code").show().typewriter();
    }));

    var runAsync = eval(Jscex.compile("async", function () {
        $await(seedAnimate());
        $await(growAnimate());
        $await(flowAnimate());
        $await(moveAnimate());
        textAnimate().start();
    }));

    runAsync().start();
})();
</script>

</body>
</html>
