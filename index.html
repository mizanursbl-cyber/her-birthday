<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HBD Adrita</title>
    <link rel="stylesheet" type="text/css" href="file/default.css">
    <script src="file/jquery.min.js"></script>
    <script src="file/jscex.min.js"></script>
    <script src="file/jscex-parser.js"></script>
    <script src="file/jscex-jit.js"></script>
    <script src="file/jscex-builderbase.min.js"></script>
    <script src="file/jscex-async.min.js"></script>
    <script src="file/jscex-async-powerpack.min.js"></script>
    <script src="file/function.js"></script>
    <script src="file/love.js"></script>
    <style>
        body { margin:0; background:#fff; overflow:hidden; }
        #wrap { position:relative; }
        #love-canvas { position:absolute; top:0; left:0; pointer-events:none; z-index:50; }
        #canvas { z-index:1; }
        #text { position:absolute; top:50px; width:100%; text-align:center; z-index:100; }
        .say { font-size:24px; font-family: 'Comic Sans MS', cursive; color:#ff2a7b; text-shadow: 2px 2px 5px #fff; }
        #clock-box { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); font-size:18px; color:#333; }
    </style>
    <script>
        function playAudio() {
            var audio = document.getElementById("myAudio");
            audio.play();
        }
    </script>
</head>
<body>
<div id="main">
    <div id="error"><a href="http://www.google.cn/chrome/intl/zh-CN/landing_chrome.html?hl=zh-CN&brand=CHMI">Chrome</a> (<a href="http://firefox.com.cn/download/">Firefox</a>)</div>
    <audio autoplay="autoplay" id="myAudio">
        <source src="aud.mp3" type="audio/mp3">
    </audio>
    <div id="wrap">
        <div id="text">
            <div id="code">
                <span class="say">Hey Sumaiya 💞</span><br>
                <span class="say">Happy Birthday 🎉</span><br>
                <span class="say">May God bless you with joy 🍀</span><br>
                <span class="say">And endless happiness 💕</span><br>
                <span class="say">You're truly amazing ❤️</span><br>
                <span class="say">Sending love, hugs & smiles 😘</span><br>
                <span class="say">Have a magical day today 🌈✨</span><br>
                <span class="say">Someone loves you from afar 🌈✨</span><br>
            </div>
        </div>
        <div id="clock-box">
            <span id="clock">577 days 0 hours 0 minutes 0 seconds</span>
        </div>
        <canvas id="canvas" width="1100" height="680"></canvas>
        <canvas id="love-canvas" width="1100" height="680"></canvas>
    </div>
</div>

<script>
(function() {
    var canvas = $('#canvas');
    if (!canvas[0].getContext) {
        $("#error").show();
        return false;
    }

    var width = canvas.width();
    var height = canvas.height();
    canvas.attr("width", width);
    canvas.attr("height", height);

    // === Tree Animation Options ===
    var opts = {
        seed: { x: width / 2 - 20, color: "rgb(190,26,37)", scale: 2 },
        branch: [ /* your existing branch data here */ ],
        bloom: { num: 700, width: 1080, height: 650 },
        footer: { width: 1200, height: 5, speed: 10 }
    };

    var tree = new Tree(canvas[0], width, height, opts);
    var seed = tree.seed;
    var foot = tree.footer;
    var hold = 1;

    canvas.click(function(e) {
        playAudio();
        var offset = canvas.offset(), x = e.pageX - offset.left, y = e.pageY - offset.top;
        if (seed.hover(x, y)) { hold = 0; canvas.unbind("click").unbind("mousemove").removeClass('hand'); }
    }).mousemove(function(e) {
        var offset = canvas.offset(), x = e.pageX - offset.left, y = e.pageY - offset.top;
        canvas.toggleClass('hand', seed.hover(x, y));
    });

    var seedAnimate = eval(Jscex.compile("async", function() {
        seed.draw();
        while(hold) { $await(Jscex.Async.sleep(10)); }
        while(seed.canScale()) { seed.scale(0.95); $await(Jscex.Async.sleep(10)); }
        while(seed.canMove()) { seed.move(0,2); foot.draw(); $await(Jscex.Async.sleep(10)); }
    }));
    var growAnimate = eval(Jscex.compile("async", function() { do { tree.grow(); $await(Jscex.Async.sleep(10)); } while(tree.canGrow()); }));
    var flowAnimate = eval(Jscex.compile("async", function() { do { tree.flower(2); $await(Jscex.Async.sleep(10)); } while(tree.canFlower()); }));
    var moveAnimate = eval(Jscex.compile("async", function() {
        tree.snapshot("p1", 240, 0, 610, 680);
        while(tree.move("p1", 500,0)) { foot.draw(); $await(Jscex.Async.sleep(10)); }
        foot.draw();
        tree.snapshot("p2", 500,0,610,680);
        canvas.parent().css("background","url("+tree.toDataURL('image/png')+")");
        canvas.css("background","#ffe");
        $await(Jscex.Async.sleep(300));
        canvas.css("background","none");
    }));

    var textAnimate = eval(Jscex.compile("async", function() { $("#code").show().typewriter(); }));
    var runAsync = eval(Jscex.compile("async", function() {
        $await(seedAnimate());
        $await(growAnimate());
        $await(flowAnimate());
        $await(moveAnimate());
        textAnimate().start();
    }));
    runAsync().start();

    // === Colorful Love Animation ===
    var loveCanvas = document.getElementById('love-canvas');
    var ctx = loveCanvas.getContext('2d');
    var hearts = [];

    function randomColor() {
        var colors = ["#ff4d6d","#ff69b4","#ff85c0","#ffb6c1","#ff007f","#ff4500","#ff6347","#ff1493"];
        return colors[Math.floor(Math.random()*colors.length)];
    }

    function createHeart() {
        hearts.push({
            x: Math.random()*width,
            y: height + 10,
            size: 10 + Math.random()*20,
            speed: 1 + Math.random()*3,
            color: randomColor(),
            rotation: Math.random()*360,
            rotationSpeed: 0.5 + Math.random()
        });
    }

    function drawHearts() {
        ctx.clearRect(0,0,width,height);
        for(var i=0;i<hearts.length;i++){
            var h = hearts[i];
            ctx.save();
            ctx.translate(h.x,h.y);
            ctx.rotate(h.rotation * Math.PI / 180);
            ctx.fillStyle = h.color;
            ctx.beginPath();
            ctx.moveTo(0,0);
            ctx.bezierCurveTo(0,-h.size/2, h.size/2,-h.size/2, h.size/2,0);
            ctx.bezierCurveTo(h.size/2,h.size/2,0,h.size*0.75,0,h.size);
            ctx.bezierCurveTo(0,h.size*0.75,-h.size/2,h.size/2,-h.size/2,0);
            ctx.bezierCurveTo(-h.size/2,-h.size/2,0,-h.size/2,0,0);
            ctx.fill();
            ctx.restore();

            h.y -= h.speed;
            h.rotation += h.rotationSpeed;
        }
        // Remove hearts above screen
        hearts = hearts.filter(h => h.y + h.size > 0);
    }

    setInterval(function() {
        if(hearts.length < 100) createHeart();
        drawHearts();
    }, 30);

})();
</script>
</body>
</html>
