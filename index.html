<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Adrita 💖</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');

    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: 'Pacifico', cursive;
        background: linear-gradient(to bottom right, #ff9a9e, #fad0c4, #fad0c4);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #fff;
    }

    #wish-box {
        position: absolute;
        top: 20%;
        width: 100%;
        text-align: center;
        z-index: 10;
    }

    .wish {
        font-size: 2.2em;
        margin: 10px 0;
        animation: fadeIn 2s ease-in-out forwards;
        opacity: 0;
    }

    #confetti-canvas {
        position: absolute;
        top: 0;
        left: 0;
    }

    audio {
        display: none;
    }

    @keyframes fadeIn {
        to { opacity: 1; }
    }
</style>
</head>
<body>

<div id="wish-box">
    <div class="wish">Hey Adrita 💞</div>
    <div class="wish" style="animation-delay:0.5s;">Wishing you a day full of smiles 😄</div>
    <div class="wish" style="animation-delay:1s;">May your heart be filled with joy and love 💖</div>
    <div class="wish" style="animation-delay:1.5s;">Keep shining bright, you're amazing ✨</div>
    <div class="wish" style="animation-delay:2s;">May all your dreams come true today 🌸</div>
    <div class="wish" style="animation-delay:2.5s;">Happy Birthday! 🎂🎉</div>
</div>

<audio id="audio" autoplay loop>
    <source src="aud.mp3" type="audio/mp3">
</audio>

<canvas id="confetti-canvas"></canvas>

<script>
// Confetti particles
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let confettiParticles = [];

function random(min, max) { return Math.random() * (max - min) + min; }

function createParticles() {
    for(let i = 0; i < 150; i++) {
        confettiParticles.push({
            x: random(0, canvas.width),
            y: random(0, canvas.height),
            radius: random(2,5),
            color: `hsl(${random(0,360)}, 100%, 50%)`,
            tilt: random(-10,10),
            tiltSpeed: random(0.05,0.1),
            speed: random(1,3)
        });
    }
}
createParticles();

function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    confettiParticles.forEach(p => {
        ctx.beginPath();
        ctx.moveTo(p.x + p.tilt, p.y);
        ctx.lineTo(p.x + p.tilt + 5, p.y + p.radius*2);
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.radius;
        ctx.stroke();

        p.y += p.speed;
        p.tilt += p.tiltSpeed;

        if(p.y > canvas.height) p.y = -10;
        if(p.x > canvas.width) p.x = 0;
    });
    requestAnimationFrame(draw);
}
draw();

// Optional: click audio to replay
document.body.addEventListener('click', ()=> {
    const audio = document.getElementById('audio');
    audio.play();
});
</script>

</body>
</html>
